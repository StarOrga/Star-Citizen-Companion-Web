project_id = "sc-companion"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4200"
# Both web URLs + loopback range for the desktop tool OAuth callback (46800-46899).
# config.toml only affects the LOCAL supabase stack; production redirect_urls must
# be edited via the Supabase dashboard (Auth → URL Configuration) and stay in
# sync with this list. See .claude/deep-knowledge/deployment-status.md § Vercel.
# The `?**` wildcard variants tolerate query strings on the OAuth callback —
# without them Supabase rejects /uploader/auth?cb=...&state=... as "Invalid
# redirect URL" (https://supabase.com/docs/guides/auth/redirect-urls).
# Belt-and-suspenders: login.component also stashes cb+state in sessionStorage
# so the round-trip survives even if the dashboard list lags behind this file.
additional_redirect_urls = [
  "http://localhost:4200/news",
  "http://localhost:4200/uploader/auth",
  "http://localhost:4200/uploader/auth?**",
  "https://sc-companion.vercel.app/news",
  "https://sc-companion.vercel.app/uploader/auth",
  "https://sc-companion.vercel.app/uploader/auth?**",
  "https://star-citizen-companion-website.vercel.app/news",
  "https://star-citizen-companion-website.vercel.app/uploader/auth",
  "https://star-citizen-companion-website.vercel.app/uploader/auth?**"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "250MiB"

[functions.fetch-verse-news]
# JWT verification OFF since #131 (public news): the feed aggregates only
# public sources (Comm-Link wiki API, YouTube RSS, Spectrum, status page) and
# must be reachable for signed-out visitors. The client's publishable key is
# `sb_publishable_*` (not a JWT), so the gateway gate would reject anonymous
# calls outright. No user data flows through this function.
verify_jwt = false

[functions.rsi-upcoming-ships]
# JWT verification OFF (same rationale as fetch-verse-news): a public read-only
# catalog diffing the public RSI ship-matrix against our datamined game data.
# Reachable by signed-out visitors; the client sends its `sb_publishable_*` key
# (not a JWT), so the platform gate would reject anonymous calls. No user data
# flows through this function (it reads codex_ships via the service role only).
verify_jwt = false

[functions.uex-proxy]
# JWT verification OFF (same rationale as fetch-verse-news): a public read-only
# proxy to the UEX Corp API for the Codex "Where to buy" feature (#254).
# Reachable by signed-out visitors; the client sends its `sb_publishable_*` key
# (not a JWT). The UEX bearer token lives only as the UEX_API_TOKEN edge secret
# and never reaches the browser. No user data flows through this function.
verify_jwt = false

[functions.process-p4k]
verify_jwt = true

[functions.ingest-catalog]
# JWT verification OFF — same rationale as ingest-bundle below. The function
# does its own auth (seed-token OR collaborator-JWT + release-token, see
# index.ts). With JWT verification ON, the platform gate rejects BOTH the
# desktop tool's asymmetric session token AND the non-JWT seed token *before*
# the function runs, breaking every codex catalog + keybinds upload. This block
# is REQUIRED, not cosmetic: `supabase functions deploy` (incl. the deploy-all
# `npm run functions:deploy`) defaults verify_jwt to TRUE when a function has no
# block, silently re-enabling the gate. Absent this block the function stayed
# working only because prior deploys passed `--no-verify-jwt` by hand. Don't
# revert without reworking the auth logic in index.ts.
verify_jwt = false

[functions.ingest-bundle]
# JWT verification OFF — the function does its own auth (getUser + admin/
# collaborator role gate + release-token, see index.ts). With JWT verification
# ON, the platform gate rejects the desktop tool's user-session token as
# "Invalid JWT" *before* the function runs: the gateway verifies against the
# legacy JWT secret, but live session tokens are signed with the project's
# asymmetric signing keys, so the gateway can't validate them (static anon-key
# calls like fetch-verse-news still pass). getUser() validates against the Auth
# server's current keys, so disabling the gate loses no security. Don't revert
# without reworking the auth logic in the function body.
verify_jwt = false

[functions.desktop-latest]
# JWT verification OFF — the function does its own auth (release-token from the
# Tool, OR JWT+role for Web UI). With JWT verification ON, the release-token
# branch can never reach the function (the platform gate rejects it). Don't
# revert this without also reworking the auth logic in the function body.
verify_jwt = false

[functions.api]
# JWT verification OFF — the /v1 API uses our own Bearer tokens (`scc_live_*`)
# OR session JWT (validated inside the tokens-mgmt handlers). /openapi.json
# and /docs are intentionally public. Platform-level JWT gate would reject
# every Bearer-token request before our middleware sees it.
verify_jwt = false

[functions.starscape-summary]
# JWT verification OFF — public, unauthenticated PNG endpoint consumed by the
# Starscape desktop wallpaper app (no login/session at boot time). Renders a
# branded weekly Verse News summary image; no user data flows through it.
verify_jwt = false

[functions.ingest-telemetry]
# JWT verification OFF — the desktop app is an unauthenticated machine client.
# The function does its own HMAC auth (X-SCC-Signature over timestamp+rawBody
# with the TELEMETRY_HMAC_KEY secret) + replay window + per-IP rate limit.
verify_jwt = false

[functions.readme-sync]
# JWT verification ON — admin-only. READ-ONLY health check for the ReadMe
# (readme.io) site; it does NOT publish. The project is Git-backed, so ReadMe
# rejects content-API writes (403 API_ACCESS_UNAVAILABLE) — docs are published
# by ReadMe Git Sync from docs/readme-io/pages/ (see GIT-SYNC-SETUP.md). The
# function reports whether the API is still closed and what the repo expects to
# be live, using README_IO_API_KEY. The handler additionally requires
# profiles.role = 'admin'.
verify_jwt = true

[functions.ship-link]
# JWT verification ON — every action is tied to a real signed-in user. The
# function stores user-supplied RSI pledge links behind a strict server-side
# allowlist (see index.ts / _rsi-url.ts) and writes exclusively through the
# CALLER'S own client, so owner-only RLS applies on top. Promotion of a link to
# a globally visible entry additionally requires profiles.role = 'admin'.
# Callers are web sessions only (same as invite-user/delete-user), so the
# platform gate is the right first line of defence here.
verify_jwt = true

[edge_runtime]
enabled = true
policy = "oneshot"
