project_id = "sc-companion"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = [
  "http://localhost:4200/news",
  "https://sc-companion.vercel.app/news"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "250MiB"

[functions.fetch-verse-news]
verify_jwt = true

[functions.process-p4k]
verify_jwt = true

[edge_runtime]
enabled = true
policy = "oneshot"
