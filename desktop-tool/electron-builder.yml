appId: com.sc-companion.desktop-tool
productName: SC Companion
copyright: SC Companion contributors
asar: true

directories:
  buildResources: build
  output: release-builds

files:
  - out/**/*
  - package.json

extraResources:
  # Embedded Python interpreter + sc_extract package (Phase 2 § A1 + § B1).
  # Produced by `node scripts/fetch-embedded-python.js` — must run before
  # `electron-builder`. The packaged app spawns
  # `<resourcesPath>/python/python.exe -m sc_extract.extract …`.
  - from: resources/python
    to: python
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SC Companion
  artifactName: sc-companion-setup-${version}-${arch}.${ext}

portable:
  artifactName: sc-companion-portable-${version}-${arch}.${ext}

# Code-signing intentionally omitted for Phase 1 — add `certificateFile` + env
# CSC_LINK / CSC_KEY_PASSWORD once an EV-cert (or self-signed cert) is wired up.
# See concept Open Question #1.

publish: null
