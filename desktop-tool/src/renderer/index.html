<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://sc-companion.vercel.app https://star-citizen-companion-website.vercel.app https://*.supabase.co" />
    <title>SC Companion</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%23050810'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%2300d4ff' stroke-width='6'/%3E%3Cpolygon points='50,28 64,58 50,50 36,58' fill='%2300d4ff'/%3E%3Cpolygon points='50,72 36,42 50,50 64,42' fill='%2300d4ff' opacity='0.55'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#00d4ff" stroke-width="6"/>
          <polygon points="50,28 64,58 50,50 36,58" fill="#00d4ff"/>
          <polygon points="50,72 36,42 50,50 64,42" fill="#00d4ff" opacity="0.55"/>
        </svg>
        <div class="brand-text">
          <strong>SC COMPANION</strong>
          <span class="sub" id="version-tag">v—</span>
        </div>
      </div>
      <div class="topbar-spacer"></div>
      <select id="lang-select" aria-label="Sprache">
        <option value="de">DE</option>
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="es">ES</option>
        <option value="pt">PT</option>
        <option value="ru">RU</option>
        <option value="zh">ZH</option>
      </select>
    </header>

    <div id="update-banner" class="update-banner hidden" role="status" aria-live="polite">
      <span id="update-banner-text"></span>
      <button id="update-banner-action" type="button" class="btn btn-primary"></button>
    </div>

    <main id="app">
      <!-- view content rendered by renderer/main.ts -->
    </main>

    <footer class="statusbar">
      <span id="status-line">…</span>
      <span class="env" id="env-line">—</span>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
