appId: com.sc-companion.data-uploader
productName: Star Citizen Companion - Data Uploader
copyright: Star Citizen Companion contributors
asar: true

directories:
  buildResources: build
  output: release-builds

files:
  - out/**/*
  - package.json

extraResources:
  # Embedded Python interpreter + sc_extract package (Phase 2 § A1 + § B1).
  # Produced by `node scripts/fetch-embedded-python.js` — must run before
  # `electron-builder`. The packaged app spawns
  # `<resourcesPath>/python/python.exe -m sc_extract.extract …`.
  - from: resources/python
    to: python
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SC Data Uploader
  artifactName: data-uploader-setup-${version}-${arch}.${ext}

portable:
  artifactName: data-uploader-portable-${version}-${arch}.${ext}
  # Persistent unpack dir. WITHOUT this, electron-builder's portable stub uses
  # a per-launch random %TEMP% folder, so the entire bundle — Electron runtime +
  # asar + the embedded ~100-200 MB Python interpreter (extraResources) —
  # re-extracts on EVERY start ("dauert ewig zu öffnen"). With a fixed name the
  # stub extracts once to %TEMP%\data-uploader-portable and reuses it on later
  # launches (it re-extracts automatically when the bundled version changes).
  unpackDirName: data-uploader-portable

# Code-signing intentionally omitted for Phase 1 — add `certificateFile` + env
# CSC_LINK / CSC_KEY_PASSWORD once an EV-cert (or self-signed cert) is wired up.
# See concept Open Question #1.

publish: null
