<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://sc-companion.vercel.app https://*.supabase.co" />
    <title>Star Citizen Companion - Data Uploader</title>
    <!-- Favicon is derived at runtime from the header logo (renderer/main.ts
         applyBranding). The logo markup itself is spliced in by
         scripts/build-brand-icons.mjs between the BRAND-MARK sentinels below —
         do not hand-edit it, `npm run check:brand-icons` will fail. -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <!-- BRAND-MARK:BEGIN -->
        <svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64" role="img">
        <defs>
        <radialGradient id="uploader-mark-disc" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#143049"/><stop offset="70%" stop-color="#0d2635"/><stop offset="100%" stop-color="#0d2635"/></radialGradient>
        <radialGradient id="uploader-mark-core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a0dcf0" stop-opacity=".9"/><stop offset="45%" stop-color="#7dd5f0" stop-opacity=".42"/><stop offset="100%" stop-color="#52c1e6" stop-opacity="0"/></radialGradient>
        </defs>
        <circle cx="50" cy="50" r="49.5" fill="url(#uploader-mark-disc)"/>
        <circle cx="50" cy="50" r="48.4" fill="none" stroke="#52c1e6" stroke-width="2.2" opacity=".55"/>
        <g transform="rotate(-20 50 50)">
        <ellipse cx="50" cy="50" rx="45" ry="12.5" fill="none" stroke="#52c1e6" stroke-width="2.4" opacity=".68" stroke-dasharray="52 26" stroke-dashoffset="13"/>
        <ellipse cx="50" cy="50" rx="34" ry="9.5" fill="none" stroke="#52c1e6" stroke-width="1.8" opacity=".5" stroke-dasharray="40 20" stroke-dashoffset="10"/>
        <circle cx="95" cy="50" r="2.6" fill="#7dd5f0"/>
        </g>
        <circle cx="50" cy="50" r="22" fill="url(#uploader-mark-core)"/>
        <path d="M50,26 L67,50 L57.5,50 L57.5,63 L42.5,63 L42.5,50 L33,50 Z" fill="#a0dcf0" stroke="#7dd5f0" stroke-width="2" stroke-linejoin="round"/>
        <rect x="36" y="68" width="28" height="5.5" rx="2.75" fill="#7dd5f0"/>
        </svg>
      <!-- BRAND-MARK:END -->
        <div class="brand-text">
          <strong>Star Citizen Companion</strong>
          <span class="sub" id="version-tag">v—</span>
        </div>
      </div>
      <div class="topbar-spacer"></div>
      <select id="lang-select" aria-label="Sprache">
        <option value="de">DE</option>
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="es">ES</option>
        <option value="pt">PT</option>
        <option value="ru">RU</option>
        <option value="zh">ZH</option>
      </select>
    </header>

    <div id="update-banner" class="update-banner hidden" role="status" aria-live="polite">
      <span id="update-banner-text"></span>
      <button id="update-banner-action" type="button" class="btn btn-primary"></button>
    </div>

    <!-- Web-connection tile: persistent across views, painted by renderer/main.ts.
         Shows session state (one-time login that persists) + server-catalog sync. -->
    <section id="connection-tile" class="conn-tile" aria-live="polite"></section>

    <main id="app">
      <!-- view content rendered by renderer/main.ts -->
    </main>

    <footer class="statusbar">
      <span id="status-line">…</span>
      <label class="telemetry-toggle" id="telemetry-toggle" title="">
        <input type="checkbox" id="telemetry-checkbox" />
        <span id="telemetry-label"></span>
      </label>
      <span class="env" id="env-line">—</span>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
