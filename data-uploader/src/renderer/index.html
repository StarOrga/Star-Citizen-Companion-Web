<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://sc-companion.vercel.app https://*.supabase.co" />
    <title>Star Citizen Companion - Data Uploader</title>
    <!-- Favicon is derived at runtime from the single header logo (renderer/main.ts
         applyBranding) so the SCC monogram lives in exactly one place. -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
          <rect width="100" height="100" rx="16" fill="#050810"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.35"/>
          <text x="50" y="63"
                font-family="Orbitron, 'Segoe UI', sans-serif"
                font-size="34" font-weight="700"
                text-anchor="middle" fill="#00d4ff" letter-spacing="1.5">SCC</text>
        </svg>
        <div class="brand-text">
          <strong>Star Citizen Companion</strong>
          <span class="sub" id="version-tag">v—</span>
        </div>
      </div>
      <div class="topbar-spacer"></div>
      <select id="lang-select" aria-label="Sprache">
        <option value="de">DE</option>
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="es">ES</option>
        <option value="pt">PT</option>
        <option value="ru">RU</option>
        <option value="zh">ZH</option>
      </select>
    </header>

    <div id="update-banner" class="update-banner hidden" role="status" aria-live="polite">
      <span id="update-banner-text"></span>
      <button id="update-banner-action" type="button" class="btn btn-primary"></button>
    </div>

    <!-- Web-connection tile: persistent across views, painted by renderer/main.ts.
         Shows session state (one-time login that persists) + server-catalog sync. -->
    <section id="connection-tile" class="conn-tile" aria-live="polite"></section>

    <main id="app">
      <!-- view content rendered by renderer/main.ts -->
    </main>

    <footer class="statusbar">
      <span id="status-line">…</span>
      <label class="telemetry-toggle" id="telemetry-toggle" title="">
        <input type="checkbox" id="telemetry-checkbox" />
        <span id="telemetry-label"></span>
      </label>
      <span class="env" id="env-line">—</span>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
