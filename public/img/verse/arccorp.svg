30.8 61.0 L126.1 55.2 L125.6 36.0 L127.8 33.3Z" fill="#6b6660"/><path d="M139.2 98.1 L113.6 112.5 L81.6 82.0 L126.1 55.2 L130.8 61.0Z" fill="#6b6660"/><path d="M33.6 175.9 L11.9 147.9 L30.2 126.8 L56.8 126.1 L68.2 143.4 L63.7 153.6Z" fill="#c2ab85"/><path d="M84.4 220.0 L18.1 220.0 L33.6 175.9 L63.7 153.6Z" fill="#c2ab85"/><path d="M71.9 81.9 L62.2 96.0 L17.1 86.1 L14.3 78.6 L35.8 51.0 L66.6 70.5Z" fill="#9e9890"/></g>
    <g fill="none" stroke="#2a2014" stroke-width=".8" stroke-linejoin="round" opacity=".6"><path d="M105.6 141.5 L101.2 144.8 L68.2 143.4 L56.8 126.1 L62.2 96.0 L71.9 81.9 L81.6 82.0 L113.6 112.5Z"/><path d="M220.0 39.1 L220.0 131.5 L165.7 112.7 L165.1 111.6 L183.9 66.0Z"/><path d="M62.2 96.0 L56.8 126.1 L30.2 126.8 L10.3 107.9 L17.1 86.1Z"/><path d="M149.5 220.0 L120.8 220.0 L101.2 144.8 L105.6 141.5 L148.6 147.3 L162.7 182.3 L160.1 198.2Z"/><path d="M14.3 78.6 L-18.7 65.5 L21.1 25.8 L27.4 27.2 L28.0 27.7 L35.8 51.0Z"/><path d="M18.1 220.0 L-20.0 220.0 L-20.0 151.0 L11.9 147.9 L33.6 175.9Z"/><path d="M122.1 -20.0 L220.0 -20.0 L220.0 -1.1 L127.8 33.3Z"/><path d="M220.0 185.9 L220.0 220.0 L149.5 220.0 L160.1 198.2Z"/><path d="M105.6 141.5 L113.6 112.5 L139.2 98.1 L165.1 111.6 L165.7 112.7 L148.6 147.3Z"/><path d="M-20.0 -20.0 L47.3 -20.0 L27.4 27.2 L21.1 25.8 L-20.0 -7.4Z"/><path d="M78.8 -20.0 L122.1 -20.0 L127.8 33.3 L125.6 36.0 L83.1 22.2 L80.6 19.0Z"/><path d="M17.1 86.1 L10.3 107.9 L-20.0 115.8 L-20.0 65.7 L-18.7 65.5 L14.3 78.6Z"/><path d="M120.8 220.0 L84.4 220.0 L63.7 153.6 L68.2 143.4 L101.2 144.8Z"/><path d="M81.6 82.0 L71.9 81.9 L66.6 70.5 L83.1 22.2 L125.6 36.0 L126.1 55.2Z"/><path d="M220.0 131.5 L220.0 133.9 L162.7 182.3 L148.6 147.3 L165.7 112.7Z"/><path d="M35.8 51.0 L28.0 27.7 L80.6 19.0 L83.1 22.2 L66.6 70.5Z"/><path d="M47.3 -20.0 L78.8 -20.0 L80.6 19.0 L28.0 27.7 L27.4 27.2Z"/><path d="M183.9 66.0 L165.1 111.6 L139.2 98.1 L130.8 61.0Z"/><path d="M220.0 133.9 L220.0 185.9 L160.1 198.2 L162.7 182.3Z"/><path d="M21.1 25.8 L-18.7 65.5 L-20.0 65.7 L-20.0 -7.4Z"/><path d="M-20.0 151.0 L-20.0 115.8 L10.3 107.9 L30.2 126.8 L11.9 147.9Z"/><path d="M220.0 -1.1 L220.0 39.1 L183.9 66.0 L130.8 61.0 L126.1 55.2 L125.6 36.0 L127.8 33.3Z"/><path d="M139.2 98.1 L113.6 112.5 L81.6 82.0 L126.1 55.2 L130.8 61.0Z"/><path d="M33.6 175.9 L11.9 147.9 L30.2 126.8 L56.8 126.1 L68.2 143.4 L63.7 153.6Z"/><path d="M84.4 220.0 L18.1 220.0 L33.6 175.9 L63.7 153.6Z"/><path d="M7