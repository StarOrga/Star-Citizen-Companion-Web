<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Star Citizen Spectrum">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161320"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ff6b3d" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sp-bg)"/>
  <rect width="640" height="360" fill="url(#sp-glow)"/>
  <g fill="#ffd9c9">
    <circle cx="90" cy="70" r="1.3" opacity="0.4"/>
    <circle cx="560" cy="80" r="1.2" opacity="0.4"/>
    <circle cx="500" cy="290" r="1.1" opacity="0.35"/>
    <circle cx="120" cy="300" r="1" opacity="0.3"/>
    <circle cx="360" cy="44" r="1" opacity="0.3"/>
  </g>
  <!-- chat / signal waveform -->
  <g fill="#ff6b3d">
    <rect x="250" y="150" width="9" height="28" rx="4.5" opacity="0.55"/>
    <rect x="270" y="134" width="9" height="60" rx="4.5" opacity="0.75"/>
    <rect x="290" y="120" width="9" height="88" rx="4.5" opacity="0.95"/>
    <rect x="310" y="138" width="9" height="52" rx="4.5" opacity="0.8"/>
    <rect x="330" y="112" width="9" height="104" rx="4.5"/>
    <rect x="350" y="142" width="9" height="44" rx="4.5" opacity="0.8"/>
    <rect x="370" y="126" width="9" height="76" rx="4.5" opacity="0.9"/>
    <rect x="390" y="148" width="9" height="32" rx="4.5" opacity="0.6"/>
  </g>
  <text x="320" y="300" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="21" font-weight="700" letter-spacing="7" fill="#ffe2d4" fill-opacity="0.6">SPECTRUM</text>
</svg>
