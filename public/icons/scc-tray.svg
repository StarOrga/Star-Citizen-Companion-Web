<?xml version="1.0" encoding="UTF-8"?>
<!--
  System-tray variant of the SCC brand mark.

  A tray icon is drawn tiny (16–32 px) on top of the OS taskbar, which is dark
  by default on Windows. The regular app icon (`scc-favicon.svg`) fills a
  near-black rounded square (#050810) — on a dark taskbar that reads as a
  black blob or, worse, as "nothing there" once downscaled. This variant
  inverts that: a TRANSPARENT background plus a solid BRIGHT-cyan coin with the
  monogram knocked out in the dark brand colour. The saturated coin stands out
  on a dark taskbar, and the dark glyph stays legible on the cyan — so the icon
  is visible on both light and dark taskbars.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Bright brand-cyan coin (no dark background rect → transparent corners) -->
  <circle cx="50" cy="50" r="47" fill="#00d4ff"/>
  <!-- SCC monogram knocked out in the dark brand colour for max contrast -->
  <text x="50" y="64"
        font-family="Orbitron, 'Segoe UI', sans-serif"
        font-size="36"
        font-weight="700"
        text-anchor="middle"
        fill="#050810"
        letter-spacing="1">SCC</text>
</svg>
