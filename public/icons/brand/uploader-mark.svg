<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="440" height="440">
<defs>
  <!-- Tunnel depth -->
  <radialGradient id="tunnel" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d2635" stop-opacity="0"/><stop offset="50%" stop-color="#52c1e6" stop-opacity=".02"/><stop offset="75%" stop-color="#52c1e6" stop-opacity=".08"/><stop offset="90%" stop-color="#7dd5f0" stop-opacity=".10"/><stop offset="100%" stop-color="#52c1e6" stop-opacity=".02"/></radialGradient>
  <!-- Core glow: warm center, NOT white -->
  <radialGradient id="coreG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a0dcf0"/><stop offset="15%" stop-color="#7dd5f0"/><stop offset="50%" stop-color="#52c1e6" stop-opacity=".55"/><stop offset="85%" stop-color="#52c1e6" stop-opacity=".15"/><stop offset="100%" stop-color="#0d2635" stop-opacity="0"/></radialGradient>
  <!-- Brain fill -->
  <radialGradient id="brainG" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#d0eef8" stop-opacity=".2"/><stop offset="100%" stop-color="#52c1e6" stop-opacity=".04"/></radialGradient>
  <!-- Halo -->
  <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#52c1e6" stop-opacity=".28"/><stop offset="40%" stop-color="#52c1e6" stop-opacity=".08"/><stop offset="100%" stop-color="#52c1e6" stop-opacity="0"/></radialGradient>
  <!-- Filters -->
  <filter id="fCl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  <!-- Outer nebula: gradient-based (no filter = no pixelation) -->
  <filter id="fW" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="fTw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5"/></filter>
  <filter id="fDk" x="-80%" y="-400%" width="260%" height="900%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="fCo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="fNd" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="fBr" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bgFade" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d2635"/><stop offset="65%" stop-color="#0d2635"/><stop offset="90%" stop-color="#0d2635" stop-opacity=".4"/><stop offset="100%" stop-color="#0d2635" stop-opacity="0"/></radialGradient>
</defs>

<!-- Circular dark background — faded edge for subtlety -->
<circle cx="150" cy="150" r="140" fill="url(#bgFade)"/>

<!-- ===== 15% MARGIN: scale core content to 70%, keep stars/bg at full size ===== -->
<g transform="translate(45,45) scale(0.7)">

<!-- ===== CLOUD LAYER 1 — Broad rotation (fills corners via larger rx/ry) ===== -->
<g filter="url(#fCl)">
  <ellipse cx="150" cy="150" rx="155" ry="120" fill="none" stroke="#52c1e6" stroke-width="32" stroke-opacity=".11"/>
  <ellipse cx="150" cy="150" rx="145" ry="112" fill="none" stroke="#7dd5f0" stroke-width="16" stroke-opacity=".08"/>
  <!-- Corner cloud puffs (pushed outward to fill corners) -->
  <circle cx="150" cy="2" r="28" fill="#52c1e6" fill-opacity=".12"/>
  <circle cx="298" cy="150" r="26" fill="#52c1e6" fill-opacity=".11"/>
  <circle cx="150" cy="298" r="28" fill="#7dd5f0" fill-opacity=".10"/>
  <circle cx="2" cy="150" r="26" fill="#52c1e6" fill-opacity=".12"/>
  <!-- Diagonal puffs closer to actual corners -->
  <circle cx="270" cy="30" r="22" fill="#7dd5f0" fill-opacity=".09"/>
  <circle cx="270" cy="270" r="22" fill="#52c1e6" fill-opacity=".09"/>
  <circle cx="30" cy="270" r="24" fill="#7dd5f0" fill-opacity=".10"/>
  <circle cx="30" cy="30" r="22" fill="#52c1e6" fill-opacity=".09"/>
</g>

<!-- ===== CLOUD LAYER 2 — Counter-rotating wisps ===== -->
<g filter="url(#fW)">
  <path d="M150,14 Q196,24 226,62 Q246,86 242,112" fill="none" stroke="#7dd5f0" stroke-width="6" stroke-linecap="round" stroke-opacity=".28"/>
  <path d="M284,190 Q276,224 250,248 Q228,268 198,278" fill="none" stroke="#7dd5f0" stroke-width="5" stroke-linecap="round" stroke-opacity=".25"/>
  <path d="M102,284 Q74,276 52,254 Q30,234 22,198" fill="none" stroke="#52c1e6" stroke-width="5" stroke-linecap="round" stroke-opacity=".24"/>
  <path d="M22,102 Q30,72 52,52 Q74,30 108,20" fill="none" stroke="#7dd5f0" stroke-width="4" stroke-linecap="round" stroke-opacity=".26"/>
  <!-- Gold wisps -->
  <path d="M206,280 Q228,260 244,234" fill="none" stroke="#c8a84b" stroke-width="3" stroke-linecap="round" stroke-opacity=".15"/>
  <path d="M58,46 Q42,66 34,92" fill="none" stroke="#c8a84b" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".12"/>
  <ellipse cx="244" cy="62" rx="28" ry="16" fill="#52c1e6" fill-opacity=".06" transform="rotate(40,244,62)"/>
  <ellipse cx="58" cy="244" rx="24" ry="14" fill="#7dd5f0" fill-opacity=".07" transform="rotate(-30,58,244)"/>
</g>

<!-- ===== CLOUD LAYER 3 — Fast thin wisps ===== -->
<g filter="url(#fTw)">
  <path d="M150,6 Q168,18 178,40 Q184,58 174,76" fill="none" stroke="#7dd5f0" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".35"/>
  <path d="M280,112 Q286,132 284,150 Q282,170 272,186" fill="none" stroke="#52c1e6" stroke-width="2" stroke-linecap="round" stroke-opacity=".32"/>
  <path d="M268,56 Q232,82 208,112 Q190,132 178,150" fill="none" stroke="#52c1e6" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".22"/>
  <path d="M32,250 Q66,224 94,196 Q116,172 130,150" fill="none" stroke="#7dd5f0" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".20"/>
</g>

<!-- Tunnel depth -->
<circle cx="150" cy="150" r="148" fill="url(#tunnel)"/>

<!-- Drifting wisps -->
<g filter="url(#fW)"><path d="M150,42 Q174,54 186,76 Q194,96 186,116" fill="none" stroke="#7dd5f0" stroke-width="4" stroke-linecap="round"/><path d="M94,34 Q74,52 64,78" fill="none" stroke="#52c1e6" stroke-width="3" stroke-linecap="round"/></g>
<g filter="url(#fW)"><path d="M234,190 Q254,174 260,150 Q264,132 256,112" fill="none" stroke="#52c1e6" stroke-width="4" stroke-linecap="round"/></g>

<!-- Cloud particles -->
<circle cx="224" cy="56" r="1.5" fill="#7dd5f0" opacity=".4"/>
<circle cx="48" cy="206" r="1" fill="#52c1e6" opacity=".35"/>


  <!-- Data Uploader signature: orbits broken open where the stream exits -->
  <g>
    <ellipse cx="150" cy="150" rx="105" ry="28" fill="none" stroke="#52c1e6" stroke-width="1.8" opacity=".34" stroke-dasharray="78 39" stroke-dashoffset="19" transform="rotate(-20,150,150)"/>
    <ellipse cx="150" cy="150" rx="86" ry="22" fill="none" stroke="#52c1e6" stroke-width="1.5" opacity=".28" stroke-dasharray="60 30" stroke-dashoffset="15" transform="rotate(-20,150,150)"/>
    <ellipse cx="150" cy="150" rx="105" ry="28" fill="none" stroke="#7dd5f0" stroke-width="5" stroke-dasharray="8 577" opacity=".85" transform="rotate(-20,150,150)" filter="url(#fDk)"/>
    <ellipse cx="150" cy="150" rx="86" ry="22" fill="none" stroke="#52c1e6" stroke-width="4.5" stroke-dasharray="7 464" opacity=".8" transform="rotate(-20,150,150)" filter="url(#fDk)"/>
  </g>

<!-- ===== BRAIN-NEBULA CORE (+10% size, seamless neural loops) ===== -->
<g filter="url(#fBr)">
  <!-- Halo -->
  <circle cx="150" cy="150" r="46" fill="url(#halo)" style="transform-origin:150px 150px;animation-delay:-.4s"/>
  <!-- Core glow -->
  <circle cx="150" cy="150" r="35" fill="url(#coreG)" filter="url(#fCo)" style="transform-origin:150px 150px"/>

  
  <!-- Data Uploader: ascending data stream replaces the brain lobes -->
  <path d="M150,78 L201,150 L172.5,150 L172.5,189 L127.5,189 L127.5,150 L99,150 Z"
        fill="#a0dcf0" fill-opacity=".9" stroke="#7dd5f0" stroke-width="6" stroke-linejoin="round"/>
  <rect x="108" y="204" width="84" height="16.5" rx="8.25" fill="#7dd5f0" fill-opacity=".9"/>

  <!-- Soft centre — kept from the master so the core reads identically -->
  <circle cx="150" cy="150" r="3.5" fill="#a0dcf0" opacity=".6"/>
</g>

</g><!-- end 15% margin scale group -->
</svg>
