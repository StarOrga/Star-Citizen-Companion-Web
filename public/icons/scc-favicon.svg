<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <!-- Dark rounded square background (matches the brand dark-bg) -->
  <rect width="100" height="100" rx="16" fill="#050810"/>
  <!-- Compass-ring outline kept for brand continuity -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.35"/>
  <!-- SCC monogram, Orbitron-flavoured -->
  <text x="50" y="63"
        font-family="Orbitron, 'Segoe UI', sans-serif"
        font-size="34"
        font-weight="700"
        text-anchor="middle"
        fill="#00d4ff"
        letter-spacing="1.5">SCC</text>
</svg>
