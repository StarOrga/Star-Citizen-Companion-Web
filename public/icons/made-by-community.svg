<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Star Citizen — Made by the Community fan site badge">
  <defs>
    <linearGradient id="mbcGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#ff5722"/>
    </linearGradient>
  </defs>
  <!-- emblem ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#mbcGlow)" stroke-width="3"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
  <!-- orbit -->
  <ellipse cx="60" cy="60" rx="40" ry="16" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6" transform="rotate(-24 60 60)"/>
  <!-- central star -->
  <path d="M60 36 L64.5 54 L82 54 L67.5 64.5 L73 82 L60 71 L47 82 L52.5 64.5 L38 54 L55.5 54 Z"
        fill="url(#mbcGlow)"/>
  <!-- community dots on the orbit -->
  <circle cx="22" cy="54" r="3" fill="#00d4ff"/>
  <circle cx="98" cy="66" r="3" fill="#ff5722"/>
  <!-- arc label baseline text -->
  <path id="mbcTop" d="M22 60 A38 38 0 0 1 98 60" fill="none"/>
  <path id="mbcBottom" d="M24 60 A36 36 0 0 0 96 60" fill="none"/>
  <text fill="#b8c3d9" font-family="Orbitron, 'Segoe UI', sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">
    <textPath href="#mbcTop" startOffset="50%">MADE BY THE</textPath>
  </text>
  <text fill="#b8c3d9" font-family="Orbitron, 'Segoe UI', sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">
    <textPath href="#mbcBottom" startOffset="50%">COMMUNITY</textPath>
  </text>
</svg>
