name: wallpaper-app

# Native Windows tray app (Rust). PRs build-check it; a `wallpaper-app-v*` tag
# builds the release binary and publishes it to the PUBLIC binaries-mirror repo
# via BINARIES_RELEASE_TOKEN — the same handoff the data-uploader uses.

on:
  push:
    branches: [main]
    paths:
      - 'wallpaper-app/**'
      - '.github/workflows/wallpaper-app-build.yml'
    tags:
      - 'wallpaper-app-v*'
  pull_request:
    paths:
      - 'wallpaper-app/**'
      - '.github/workflows/wallpaper-app-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wallpaper-app
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (MSVC, preinstalled on the runner)
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      # Puts rc.exe (Windows SDK resource compiler) on PATH so build.rs/winresource
      # can embed the app icon + VERSIONINFO. Without it winresource fails "program
      # not found" and — being non-fatal by design — would silently ship a binary
      # with no icon and no "Starscape" process name.
      - name: MSVC developer environment (rc.exe for the icon/version resource)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Unit tests (version compare, JSON scanning, form/percent decoding, CNG
      # SHA-256 vectors, DPAPI round-trip). These are the parts of the updater
      # whose failure modes are silent, so they are a hard gate, not optional.
      - name: Test
        run: cargo test --locked

      # Per-release bearer token, mirroring the data-uploader's SC_RELEASE_TOKEN
      # build define. Only tagged builds get one: it must exist as a
      # desktop_releases row to be accepted, and a PR build has no such row.
      # The full UUID is masked from the log; only the 8-char fingerprint may be
      # printed. Subsequent steps read it from the environment, so `option_env!`
      # in src/update.rs bakes it into the binary.
      - name: Generate release token
        id: token
        if: startsWith(github.ref, 'refs/tags/wallpaper-app-v')
        shell: pwsh
        run: |
          $token = [guid]::NewGuid().ToString()
          Write-Host "::add-mask::$token"
          "SC_RELEASE_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "fingerprint=$($token.Substring(0,8))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Persist full token as a private artefact
        if: startsWith(github.ref, 'refs/tags/wallpaper-app-v')
        shell: pwsh
        env:
          SC_RELEASE_TOKEN: ${{ env.SC_RELEASE_TOKEN }}
        run: '"$env:SC_RELEASE_TOKEN" | Out-File -FilePath release-token.txt -Encoding utf8 -NoNewline'

      - name: Upload full token artefact (repo collaborators only)
        if: startsWith(github.ref, 'refs/tags/wallpaper-app-v')
        uses: actions/upload-artifact@v4
        with:
          name: release-token
          path: wallpaper-app/release-token.txt
          retention-days: 7

      - name: Build (release)
        run: cargo build --release

      # Hard gate: fail the build if the version resource did not embed, so a
      # missing icon/name can never reach a release.
      - name: Verify embedded icon + version resource
        shell: pwsh
        run: |
          $vi = (Get-Item target/release/starscape-wallpaper.exe).VersionInfo
          Write-Host "FileDescription='$($vi.FileDescription)' ProductName='$($vi.ProductName)' FileVersion='$($vi.FileVersion)'"
          if ($vi.FileDescription -ne 'Starscape') {
            throw "Version resource missing/incorrect (FileDescription='$($vi.FileDescription)') — winresource could not embed it."
          }

      # One build, four names. A release ring is a promotion POINTER, not a
      # separate build, so the ring cannot be baked into the binary — but the
      # app must still know which ring it was downloaded from. The filename is
      # the only signal that survives a plain single-file download, so each ring
      # gets its own identically-byte-for-byte asset name and the app reads its
      # ring off its own filename on first start (src/update.rs).
      - name: Stage tagged artifacts (canonical + one name per ring)
        if: startsWith(github.ref, 'refs/tags/wallpaper-app-v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^wallpaper-app-v', ''
          $src = "target/release/starscape-wallpaper.exe"
          Copy-Item $src "starscape-wallpaper-$v.exe"
          foreach ($ring in 'stable','beta','alpha') {
            Copy-Item $src "starscape-wallpaper-$v-$ring.exe"
          }
          # Version-less alias for the never-stale 'latest' download URL.
          Copy-Item $src "starscape-wallpaper.exe"
          $sha = (Get-FileHash -Algorithm SHA256 "starscape-wallpaper-$v.exe").Hash.ToLower()
          $size = (Get-Item "starscape-wallpaper-$v.exe").Length
          Write-Host "asset: starscape-wallpaper-$v.exe  size=$size  sha256=$sha"
          Write-Host "ring aliases: starscape-wallpaper-$v-{stable,beta,alpha}.exe (identical bytes)"

      - name: Publish to PUBLIC binaries-mirror release (end-user download)
        if: startsWith(github.ref, 'refs/tags/wallpaper-app-v')
        uses: softprops/action-gh-release@v2
        with:
          repository: StarOrga/Star-Citizen-Companion-Binaries
          token: ${{ secrets.BINARIES_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: wallpaper-app/starscape-wallpaper-*.exe
          fail_on_unmatched_files: false
          body: |
            **Starscape Wallpaper** — tiny native Windows tray app that rotates your
            desktop background through the Star Citizen Companion "Starscape" gallery
            (original-resolution RSI news art), with an optional crossfade and
            one-click autostart. No installer, ~0.3 MB, runs from the tray.

            Unsigned (Phase-2 limitation) — Windows SmartScreen will warn on first
            run: choose **More info → Run anyway**.

            Source: [Star-Citizen-Companion-Web](https://github.com/StarOrga/Star-Citizen-Companion-Web) (private).

      - name: Update stable 'latest' alias release (never-stale download URL)
        if: startsWith(github.ref, 'refs/tags/wallpaper-app-v')
        uses: softprops/action-gh-release@v2
        with:
          repository: StarOrga/Star-Citizen-Companion-Binaries
          token: ${{ secrets.BINARIES_RELEASE_TOKEN }}
          tag_name: wallpaper-app-latest
          name: Starscape Wallpaper (latest)
          # Version-less asset → the website links a fixed URL that always resolves
          # to the newest build: …/releases/download/wallpaper-app-latest/starscape-wallpaper.exe
          files: wallpaper-app/starscape-wallpaper.exe
          fail_on_unmatched_files: false
          body: |
            Always the newest **Starscape Wallpaper** build — an alias of the most
            recent `wallpaper-app-v*` release. The website's "Download for Windows"
            button points here so the link never goes stale.

            Unsigned (Phase-2 limitation) — Windows SmartScreen will warn on first
            run: choose **More info → Run anyway**.

      # Registers the build in Supabase `desktop_releases` (product='starscape')
      # AND points the ALPHA ring at it — same promotion model as the uploader
      # (alpha → beta → stable via promote_starscape_channel). The routine env's
      # Supabase MCP is authenticated, so copy this SQL into the MCP/SQL editor
      # after the release. The full release token is a masked secret and is NEVER
      # printed: download the `release-token` workflow artefact for it.
      - name: Print Starscape desktop_releases register SQL
        if: startsWith(github.ref, 'refs/tags/wallpaper-app-v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^wallpaper-app-v', ''
          $exe = "starscape-wallpaper-$v.exe"
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $size = (Get-Item $exe).Length
          $base = "https://github.com/StarOrga/Star-Citizen-Companion-Binaries/releases/download/${{ github.ref_name }}"
          $asset = { param($n) "jsonb_build_object('url','$base/$n','kind','exe','sha256','$sha','size_bytes',$size)" }
          Write-Host "=== Release token fingerprint: ${{ steps.token.outputs.fingerprint }}… (full UUID = `release-token` artefact) ==="
          Write-Host "=== Register this Starscape build + point ALPHA at it (Supabase SQL editor / MCP) ==="
          Write-Host "WITH new_rel AS ("
          Write-Host "  INSERT INTO public.desktop_releases (product, version, release_token, platforms, notes)"
          Write-Host "  VALUES ('starscape', '$v', '<full-release-token-uuid>', jsonb_build_object("
          Write-Host "    'win-x64',        $(& $asset $exe),"
          Write-Host "    'win-x64-stable', $(& $asset "starscape-wallpaper-$v-stable.exe"),"
          Write-Host "    'win-x64-beta',   $(& $asset "starscape-wallpaper-$v-beta.exe"),"
          Write-Host "    'win-x64-alpha',  $(& $asset "starscape-wallpaper-$v-alpha.exe")"
          Write-Host "  ), 'Starscape wallpaper $v') RETURNING id"
          Write-Host ")"
          Write-Host "INSERT INTO public.desktop_channels (product, channel, release_id)"
          Write-Host "SELECT 'starscape', 'alpha', id FROM new_rel"
          Write-Host "ON CONFLICT (product, channel) DO UPDATE"
          Write-Host "  SET release_id = EXCLUDED.release_id, updated_at = now();"
          Write-Host "=== Then promote:  select promote_starscape_channel('$v','beta');  … ('$v','stable'); ==="
