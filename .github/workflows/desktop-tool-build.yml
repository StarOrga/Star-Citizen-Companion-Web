name: desktop-tool

on:
  push:
    branches: [main]
    paths:
      - 'desktop-tool/**'
      - '.github/workflows/desktop-tool-build.yml'
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop-tool/**'
      - '.github/workflows/desktop-tool-build.yml'

permissions:
  contents: write

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'npm'
          cache-dependency-path: desktop-tool/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python-sidecar-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-tool/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the embedded Python the desktop tool actually ships
          # (scripts/fetch-embedded-python.js). scdatatools 1.0.0 pins
          # numpy~=1.21.5 which needs Python <3.11 STRICT.
          # See .claude/deep-knowledge/desktop-tool-python.md.
          python-version: '3.10'
      - name: Install pytest
        # We intentionally avoid `pip install -r requirements.txt` here —
        # scdatatools needs CryEngine deps that aren't relevant for the
        # threshold/heuristic tests. The sidecar tests only need pytest;
        # an integration test that exercises scdatatools belongs in a
        # separate (slower) workflow against the real-subset fixture.
        run: python -m pip install --upgrade pip pytest
      - name: Regenerate synthetic fixture
        # Recompute it in CI so the committed copy can't drift from the
        # generator. Test will assert content matches.
        run: python scripts/build-synthetic-fixture.py --out tests/fixtures/synthetic.p4k
      - name: Run pytest
        run: python -m pytest tests/ -v

  build-windows:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [typecheck-and-test, python-sidecar-test]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'npm'
          cache-dependency-path: desktop-tool/package-lock.json
      - run: npm ci
      - name: Generate release token
        id: token
        # The full UUID is the authentication secret — only the 8-char
        # fingerprint may end up in logs or release notes (Codex review
        # 2026-05-24, finding HIGH 2). The full token is masked from logs
        # via ::add-mask:: AND only exposed to subsequent steps via
        # GITHUB_ENV (env-var; never an output). The maintainer fetches
        # the full token from the workflow's encrypted secrets section
        # (or by re-running with `--print-token` locally).
        run: |
          $token = [guid]::NewGuid().ToString()
          $fingerprint = $token.Substring(0, 8)
          Write-Host "::add-mask::$token"
          "SC_RELEASE_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "release_token_fingerprint=$fingerprint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh
      - name: Persist full token as encrypted artefact
        # The maintainer needs the full UUID to insert into
        # desktop_releases. Write it to a file, upload as a workflow
        # artefact with retention=7d. Repo collaborators with workflow
        # access can download it via gh run download — NOT exposed on
        # the public release page.
        env:
          SC_RELEASE_TOKEN: ${{ env.SC_RELEASE_TOKEN }}
        run: |
          "$env:SC_RELEASE_TOKEN" | Out-File -FilePath release-token.txt -Encoding utf8 -NoNewline
        shell: pwsh
      - name: Upload full token artefact (private to repo collaborators)
        uses: actions/upload-artifact@v4
        with:
          name: release-token
          path: desktop-tool/release-token.txt
          retention-days: 7
      - name: Build (electron-vite)
        env:
          SC_RELEASE_TOKEN: ${{ env.SC_RELEASE_TOKEN }}
          SC_API_BASE: https://sc-companion.vercel.app
        run: npm run build
      - name: Package (electron-builder)
        env:
          SC_RELEASE_TOKEN: ${{ env.SC_RELEASE_TOKEN }}
        run: npm run package:win
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sc-companion-win-x64
          path: |
            desktop-tool/release-builds/*.exe
            desktop-tool/release-builds/*.blockmap
            desktop-tool/release-builds/latest*.yml
      - name: Publish to PRIVATE source-repo release (for maintainers + token artefact handoff)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-tool/release-builds/*.exe
            desktop-tool/release-builds/*.blockmap
            desktop-tool/release-builds/latest*.yml
          fail_on_unmatched_files: false
          body: |
            Automated build from tag ${{ github.ref_name }}.

            **Public download (end-users):** see the matching release in
            [Jerry0022/sc-companion-binaries](https://github.com/Jerry0022/sc-companion-binaries/releases/tag/${{ github.ref_name }})
            — that's the URL `electron-updater` and the `desktop_releases`
            row should point at.

            **Release token fingerprint:** `${{ steps.token.outputs.release_token_fingerprint }}…` (first 8 chars stored in the binary; download the **release-token** workflow artefact to get the full UUID, then register it in `desktop_releases` via the admin RPC alongside the public URLs above).

      - name: Publish to PUBLIC binaries-mirror release (end-user download)
        # End-users with the installed Tool can't authenticate to GitHub, so
        # the auto-update download URL must be publicly accessible. We
        # publish a mirror release in the public `sc-companion-binaries`
        # repo via a fine-grained PAT (scope: Contents R/W on that repo
        # only) stored as `BINARIES_RELEASE_TOKEN`. See
        # https://github.com/Jerry0022/Star-Citizen-Companion-Website/issues/7
        # for the full rationale.
        uses: softprops/action-gh-release@v2
        with:
          repository: Jerry0022/sc-companion-binaries
          token: ${{ secrets.BINARIES_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            desktop-tool/release-builds/*.exe
            desktop-tool/release-builds/*.blockmap
            desktop-tool/release-builds/latest*.yml
          fail_on_unmatched_files: false
          body: |
            Automated mirror of [source release](https://github.com/Jerry0022/Star-Citizen-Companion-Website/releases/tag/${{ github.ref_name }}).

            Binaries are signed by the build, not by a code-signing cert
            (Phase-2 limitation — Windows SmartScreen will warn on first
            run). SHA-256 sums for verification live in the matching
            `desktop_releases.platforms` row.

            Source code: [Star-Citizen-Companion-Website](https://github.com/Jerry0022/Star-Citizen-Companion-Website) (private).

      - name: Print public asset URLs (for desktop_releases.platforms registration)
        # Surfaces the public URLs in the action log so the admin doesn't
        # have to construct them by hand. Copy/paste into the admin RPC
        # call alongside the release-token from the workflow artefact.
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^desktop-v', ''
          Write-Host ""
          Write-Host "================================================================"
          Write-Host "PUBLIC ASSET URLS for desktop_releases.platforms:"
          Write-Host "================================================================"
          Write-Host "  win-x64-setup    https://github.com/Jerry0022/sc-companion-binaries/releases/download/$tag/sc-companion-setup-$version-x64.exe"
          Write-Host "  win-x64-portable https://github.com/Jerry0022/sc-companion-binaries/releases/download/$tag/sc-companion-portable-$version-x64.exe"
          Write-Host "  win-x64-yml      https://github.com/Jerry0022/sc-companion-binaries/releases/download/$tag/latest.yml"
          Write-Host "================================================================"
          Write-Host ""
