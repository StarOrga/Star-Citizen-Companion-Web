name: desktop-tool

on:
  push:
    branches: [main]
    paths:
      - 'desktop-tool/**'
      - '.github/workflows/desktop-tool-build.yml'
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop-tool/**'
      - '.github/workflows/desktop-tool-build.yml'

permissions:
  contents: write

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'npm'
          cache-dependency-path: desktop-tool/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python-sidecar-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-tool/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the embedded Python the desktop tool actually ships
          # (scripts/fetch-embedded-python.js). scdatatools 1.0.0 pins
          # numpy~=1.21.5 which needs Python <3.11 STRICT.
          # See .claude/deep-knowledge/desktop-tool-python.md.
          python-version: '3.10'
      - name: Install pytest
        # We intentionally avoid `pip install -r requirements.txt` here —
        # scdatatools needs CryEngine deps that aren't relevant for the
        # threshold/heuristic tests. The sidecar tests only need pytest;
        # an integration test that exercises scdatatools belongs in a
        # separate (slower) workflow against the real-subset fixture.
        run: python -m pip install --upgrade pip pytest
      - name: Regenerate synthetic fixture
        # Recompute it in CI so the committed copy can't drift from the
        # generator. Test will assert content matches.
        run: python scripts/build-synthetic-fixture.py --out tests/fixtures/synthetic.p4k
      - name: Run pytest
        run: python -m pytest tests/ -v

  build-windows:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [typecheck-and-test, python-sidecar-test]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tool
    # Set at JOB level so every npm/electron-vite call (including the one
    # inside `package:win` chain) inherits them. Previously only the
    # `Build (electron-vite)` step had SC_API_BASE → the second electron-vite
    # invocation inside `package:win` fell back to localhost:4200, baking
    # the wrong URL into the packaged binary.
    env:
      # Supabase Edge Functions live here — desktop-latest + ingest-bundle
      # + check-bundle. Direct API calls, no web layer.
      SC_API_BASE: https://hcnqhvzlavdycidqyaai.supabase.co
      # Web app (OAuth callback page /desktop/auth). Vercel project is
      # `star-citizen-companion-website`, primary alias `sc-companion.vercel.app`.
      SC_WEB_BASE: https://sc-companion.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'npm'
          cache-dependency-path: desktop-tool/package-lock.json
      - run: npm ci
      - name: Generate release token
        id: token
        # The full UUID is the authentication secret — only the 8-char
        # fingerprint may end up in logs or release notes (Codex review
        # 2026-05-24, finding HIGH 2). The full token is masked from logs
        # via ::add-mask:: AND only exposed to subsequent steps via
        # GITHUB_ENV (env-var; never an output). The maintainer fetches
        # the full token from the workflow's encrypted secrets section
        # (or by re-running with `--print-token` locally).
        run: |
          $token = [guid]::NewGuid().ToString()
          $fingerprint = $token.Substring(0, 8)
          Write-Host "::add-mask::$token"
          "SC_RELEASE_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "release_token_fingerprint=$fingerprint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh
      - name: Persist full token as encrypted artefact
        # The maintainer needs the full UUID to insert into
        # desktop_releases. Write it to a file, upload as a workflow
        # artefact with retention=7d. Repo collaborators with workflow
        # access can download it via gh run download — NOT exposed on
        # the public release page.
        env:
          SC_RELEASE_TOKEN: ${{ env.SC_RELEASE_TOKEN }}
        run: |
          "$env:SC_RELEASE_TOKEN" | Out-File -FilePath release-token.txt -Encoding utf8 -NoNewline
        shell: pwsh
      - name: Upload full token artefact (private to repo collaborators)
        uses: actions/upload-artifact@v4
        with:
          name: release-token
          path: desktop-tool/release-token.txt
          retention-days: 7
      - name: Build (electron-vite)
        run: npm run build
      - name: Package (electron-builder)
        run: npm run package:win
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sc-companion-win-x64
          path: |
            desktop-tool/release-builds/*.exe
            desktop-tool/release-builds/*.blockmap
            desktop-tool/release-builds/latest*.yml
      - name: Publish to PRIVATE source-repo release (for maintainers + token artefact handoff)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-tool/release-builds/*.exe
            desktop-tool/release-builds/*.blockmap
            desktop-tool/release-builds/latest*.yml
          fail_on_unmatched_files: false
          body: |
            Automated build from tag ${{ github.ref_name }}.

            **Public download (end-users):** see the matching release in
            [StarOrga/Star-Citizen-Companion-Binaries](https://github.com/StarOrga/Star-Citizen-Companion-Binaries/releases/tag/${{ github.ref_name }})
            — that's the URL `electron-updater` and the `desktop_releases`
            row should point at.

            **Release token fingerprint:** `${{ steps.token.outputs.release_token_fingerprint }}…` (first 8 chars stored in the binary; download the **release-token** workflow artefact to get the full UUID, then register it in `desktop_releases` via the admin RPC alongside the public URLs above).

      - name: Publish to PUBLIC binaries-mirror release (end-user download)
        # End-users with the installed Tool can't authenticate to GitHub, so
        # the auto-update download URL must be publicly accessible. We
        # publish a mirror release in the public `Star-Citizen-Companion-Binaries`
        # repo via a fine-grained PAT (scope: Contents R/W on that repo
        # only) stored as `BINARIES_RELEASE_TOKEN`. See
        # https://github.com/Jerry0022/Star-Citizen-Companion-Website/issues/7
        # for the full rationale.
        uses: softprops/action-gh-release@v2
        with:
          repository: StarOrga/Star-Citizen-Companion-Binaries
          token: ${{ secrets.BINARIES_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            desktop-tool/release-builds/*.exe
            desktop-tool/release-builds/*.blockmap
            desktop-tool/release-builds/latest*.yml
          fail_on_unmatched_files: false
          body: |
            Automated mirror of [source release](https://github.com/Jerry0022/Star-Citizen-Companion-Website/releases/tag/${{ github.ref_name }}).

            Binaries are signed by the build, not by a code-signing cert
            (Phase-2 limitation — Windows SmartScreen will warn on first
            run). SHA-256 sums for verification live in the matching
            `desktop_releases.platforms` row.

            Source code: [Star-Citizen-Companion-Website](https://github.com/Jerry0022/Star-Citizen-Companion-Website) (private).

      - name: Print public asset URLs + SHA-512 + sizes (for desktop_releases.platforms registration)
        # Surfaces every field the admin needs into the action log so the
        # `desktop_releases` INSERT can be copy-pasted without local
        # downloads or hash computations. SHA-512 is mandatory —
        # electron-updater's YAML parser hardcodes the `sha512:` key and
        # fails install-time verification on size or hash mismatch.
        # The desktop-tool/package.json version is the canonical "binary
        # internal" version (electron-vite bakes it into __SC_TOOL_VERSION__).
        # Tag and binary-version can drift on CI-retries — the admin
        # registers with version = binary version, NOT the tag.
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Read the binary version from the build output filename — that's
          # the truth (matches __SC_TOOL_VERSION__ inside the binary), not
          # the tag (which can be a CI-retry cookie on the same source).
          $setupFile = Get-ChildItem release-builds/sc-companion-setup-*-x64.exe | Select-Object -First 1
          $portableFile = Get-ChildItem release-builds/sc-companion-portable-*-x64.exe | Select-Object -First 1
          $binVersion = ($setupFile.Name -replace '^sc-companion-setup-', '') -replace '-x64\.exe$', ''

          $setupSha = (Get-FileHash -Algorithm SHA512 $setupFile.FullName).Hash.ToLower()
          $portableSha = (Get-FileHash -Algorithm SHA512 $portableFile.FullName).Hash.ToLower()
          $setupSize = $setupFile.Length
          $portableSize = $portableFile.Length

          $setupUrl = "https://github.com/StarOrga/Star-Citizen-Companion-Binaries/releases/download/$tag/$($setupFile.Name)"
          $portableUrl = "https://github.com/StarOrga/Star-Citizen-Companion-Binaries/releases/download/$tag/$($portableFile.Name)"

          Write-Host ""
          Write-Host "================================================================"
          Write-Host "PASTE INTO ADMIN INSERT for desktop_releases (Supabase SQL editor):"
          Write-Host "================================================================"
          Write-Host ""
          Write-Host "INSERT INTO public.desktop_releases (version, is_current, release_token, platforms, notes)"
          Write-Host "VALUES ("
          Write-Host "  '$binVersion',"
          Write-Host "  true,"
          Write-Host "  '<UUID-from-release-token-artefact>',"
          Write-Host "  jsonb_build_object("
          Write-Host "    'win-x64-setup', jsonb_build_object("
          Write-Host "      'url', '$setupUrl',"
          Write-Host "      'kind', 'nsis',"
          Write-Host "      'sha512', '$setupSha',"
          Write-Host "      'size_bytes', $setupSize"
          Write-Host "    ),"
          Write-Host "    'win-x64-portable', jsonb_build_object("
          Write-Host "      'url', '$portableUrl',"
          Write-Host "      'kind', 'portable',"
          Write-Host "      'sha512', '$portableSha',"
          Write-Host "      'size_bytes', $portableSize"
          Write-Host "    )"
          Write-Host "  ),"
          Write-Host "  'TODO: release notes here'"
          Write-Host ");"
          Write-Host ""
          Write-Host "Remember to set the prior is_current row to false first:"
          Write-Host "  UPDATE public.desktop_releases SET is_current = false WHERE is_current = true;"
          Write-Host "================================================================"
          Write-Host ""
