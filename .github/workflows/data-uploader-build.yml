name: data-uploader

on:
  push:
    branches: [main]
    paths:
      - 'data-uploader/**'
      - '.github/workflows/data-uploader-build.yml'
    tags:
      - 'data-uploader-v*'
  pull_request:
    paths:
      - 'data-uploader/**'
      - '.github/workflows/data-uploader-build.yml'

permissions:
  contents: write

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'npm'
          cache-dependency-path: data-uploader/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python-sidecar-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-uploader/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the embedded Python the data uploader actually ships
          # (scripts/fetch-embedded-python.js pins 3.10.15). The numpy~=1.21.5
          # constraint that forces 3.10 comes from scdatatools 1.0.4's metadata
          # and only bites at FULL-requirements install time — this job installs
          # only pytest (no scdatatools), so it never exercises that resolution.
          # See .claude/deep-knowledge/data-uploader-python.md.
          python-version: '3.10'
      - name: Install pytest
        # We intentionally avoid `pip install -r requirements.txt` here —
        # scdatatools needs CryEngine deps that aren't relevant for the
        # threshold/heuristic tests. The sidecar tests only need pytest;
        # an integration test that exercises scdatatools belongs in a
        # separate (slower) workflow against the real-subset fixture.
        run: python -m pip install --upgrade pip pytest
      - name: Regenerate synthetic fixture
        # Recompute it in CI so the committed copy can't drift from the
        # generator. Test will assert content matches.
        run: python scripts/build-synthetic-fixture.py --out tests/fixtures/synthetic.p4k
      - name: Run pytest
        run: python -m pytest tests/ -v

  build-windows:
    if: startsWith(github.ref, 'refs/tags/data-uploader-v')
    needs: [typecheck-and-test, python-sidecar-test]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: data-uploader
    # Set at JOB level so every npm/electron-vite call (including the one
    # inside `package:win` chain) inherits them. Previously only the
    # `Build (electron-vite)` step had SC_API_BASE → the second electron-vite
    # invocation inside `package:win` fell back to localhost:4200, baking
    # the wrong URL into the packaged binary.
    env:
      # Supabase Edge Functions live here — desktop-latest + ingest-bundle
      # + check-bundle. Direct API calls, no web layer.
      SC_API_BASE: https://hcnqhvzlavdycidqyaai.supabase.co
      # Web app (OAuth callback page /uploader/auth). Vercel project is
      # `star-citizen-companion-web`, primary alias `sc-companion.vercel.app`.
      SC_WEB_BASE: https://sc-companion.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'npm'
          cache-dependency-path: data-uploader/package-lock.json
      - run: npm ci
      - name: Generate release token
        id: token
        # The full UUID is the authentication secret — only the 8-char
        # fingerprint may end up in logs or release notes (Codex review
        # 2026-05-24, finding HIGH 2). The full token is masked from logs
        # via ::add-mask:: AND only exposed to subsequent steps via
        # GITHUB_ENV (env-var; never an output). The maintainer fetches
        # the full token from the workflow's encrypted secrets section
        # (or by re-running with `--print-token` locally).
        run: |
          $token = [guid]::NewGuid().ToString()
          $fingerprint = $token.Substring(0, 8)
          Write-Host "::add-mask::$token"
          "SC_RELEASE_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "release_token_fingerprint=$fingerprint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh
      - name: Persist full token as encrypted artefact
        # The maintainer needs the full UUID to insert into
        # desktop_releases. Write it to a file, upload as a workflow
        # artefact with retention=7d. Repo collaborators with workflow
        # access can download it via gh run download — NOT exposed on
        # the public release page.
        env:
          SC_RELEASE_TOKEN: ${{ env.SC_RELEASE_TOKEN }}
        run: |
          "$env:SC_RELEASE_TOKEN" | Out-File -FilePath release-token.txt -Encoding utf8 -NoNewline
        shell: pwsh
      - name: Upload full token artefact (private to repo collaborators)
        uses: actions/upload-artifact@v4
        with:
          name: release-token
          path: data-uploader/release-token.txt
          retention-days: 7
      - name: Build (electron-vite)
        run: npm run build
      - name: Package (electron-builder)
        run: npm run package:win
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: data-uploader-win-x64
          path: |
            data-uploader/release-builds/*.exe
            data-uploader/release-builds/*.blockmap
            data-uploader/release-builds/latest*.yml
      - name: Publish to PRIVATE source-repo release (for maintainers + token artefact handoff)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            data-uploader/release-builds/*.exe
            data-uploader/release-builds/*.blockmap
            data-uploader/release-builds/latest*.yml
          fail_on_unmatched_files: false
          body: |
            Automated build from tag ${{ github.ref_name }}.

            **Public download (end-users):** see the matching release in
            [StarOrga/Star-Citizen-Companion-Binaries](https://github.com/StarOrga/Star-Citizen-Companion-Binaries/releases/tag/${{ github.ref_name }})
            — that's the URL `electron-updater` and the `desktop_releases`
            row should point at.

            **Release token fingerprint:** `${{ steps.token.outputs.release_token_fingerprint }}…` (first 8 chars stored in the binary; download the **release-token** workflow artefact to get the full UUID, then register the build with the CTE printed in the build log — it registers `desktop_releases` AND points the **alpha** ring at it — then promote alpha → beta → stable in the web `/admin/desktop-releases` panel).

      - name: Publish to PUBLIC binaries-mirror release (end-user download)
        # End-users with the installed Tool can't authenticate to GitHub, so
        # the auto-update download URL must be publicly accessible. We
        # publish a mirror release in the public `Star-Citizen-Companion-Binaries`
        # repo via a fine-grained PAT (scope: Contents R/W on that repo
        # only) stored as `BINARIES_RELEASE_TOKEN`. See
        # https://github.com/StarOrga/Star-Citizen-Companion-Web/issues/7
        # for the full rationale.
        uses: softprops/action-gh-release@v2
        with:
          repository: StarOrga/Star-Citizen-Companion-Binaries
          token: ${{ secrets.BINARIES_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            data-uploader/release-builds/*.exe
            data-uploader/release-builds/*.blockmap
            data-uploader/release-builds/latest*.yml
          fail_on_unmatched_files: false
          body: |
            Automated mirror of [source release](https://github.com/StarOrga/Star-Citizen-Companion-Web/releases/tag/${{ github.ref_name }}).

            Binaries are signed by the build, not by a code-signing cert
            (Phase-2 limitation — Windows SmartScreen will warn on first
            run). SHA-256 sums for verification live in the matching
            `desktop_releases.platforms` row.

            Source code: [Star-Citizen-Companion-Web](https://github.com/StarOrga/Star-Citizen-Companion-Web) (private).

      - name: Print catalog-register SQL — alpha default + all-rings fast-track (desktop_releases + desktop_channels)
        # Surfaces every field the admin needs into the action log so the
        # `desktop_releases` INSERT can be copy-pasted without local
        # downloads or hash computations. SHA-512 is mandatory —
        # electron-updater's YAML parser hardcodes the `sha512:` key and
        # fails install-time verification on size or hash mismatch.
        # The data-uploader/package.json version is the canonical "binary
        # internal" version (electron-vite bakes it into __SC_TOOL_VERSION__).
        # Tag and binary-version can drift on CI-retries — the admin
        # registers with version = binary version, NOT the tag.
        #
        # Two ready-to-paste blocks are printed:
        #   1. DEFAULT — points the ALPHA ring only (promotion-pointer model;
        #      promote alpha -> beta -> stable later). Correct for normal releases.
        #   2. FAST-TRACK — points ALL rings at once. Use for the FIRST release or
        #      a hotfix that must reach every installed build immediately (e.g. an
        #      older build whose updater asks a lower ring that has no newer build
        #      yet). Deliberately opt-in — do NOT make this the default, it skips
        #      the ring soak.
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Read the binary version from the build output filename — that's
          # the truth (matches __SC_TOOL_VERSION__ inside the binary), not
          # the tag (which can be a CI-retry cookie on the same source).
          $setupFile = Get-ChildItem release-builds/data-uploader-setup-*-x64.exe | Select-Object -First 1
          $portableFile = Get-ChildItem release-builds/data-uploader-portable-*-x64.exe | Select-Object -First 1
          $binVersion = ($setupFile.Name -replace '^data-uploader-setup-', '') -replace '-x64\.exe$', ''

          $setupSha = (Get-FileHash -Algorithm SHA512 $setupFile.FullName).Hash.ToLower()
          $portableSha = (Get-FileHash -Algorithm SHA512 $portableFile.FullName).Hash.ToLower()
          $setupSize = $setupFile.Length
          $portableSize = $portableFile.Length

          $setupUrl = "https://github.com/StarOrga/Star-Citizen-Companion-Binaries/releases/download/$tag/$($setupFile.Name)"
          $portableUrl = "https://github.com/StarOrga/Star-Citizen-Companion-Binaries/releases/download/$tag/$($portableFile.Name)"

          # The full release token is a masked secret and is NEVER printed here.
          # Fetch it from the workflow's private artefact and paste it for <UUID>:
          $tokenCmd = "gh run download ${{ github.run_id }} -n release-token --repo StarOrga/Star-Citizen-Companion-Web"

          function Emit-Block($title, $mode) {
            Write-Host "================================================================"
            Write-Host $title
            Write-Host "================================================================"
            Write-Host "WITH new_rel AS ("
            Write-Host "  INSERT INTO public.desktop_releases (version, release_token, platforms, notes)"
            Write-Host "  VALUES ("
            Write-Host "    '$binVersion',"
            Write-Host "    '<UUID>',"
            Write-Host "    jsonb_build_object("
            Write-Host "      'win-x64-setup', jsonb_build_object('url','$setupUrl','kind','nsis','sha512','$setupSha','size_bytes',$setupSize),"
            Write-Host "      'win-x64-portable', jsonb_build_object('url','$portableUrl','kind','portable','sha512','$portableSha','size_bytes',$portableSize)"
            Write-Host "    ),"
            Write-Host "    'TODO release notes'"
            Write-Host "  )"
            Write-Host "  RETURNING id"
            Write-Host ")"
            if ($mode -eq 'all') {
              Write-Host "INSERT INTO public.desktop_channels (channel, release_id)"
              Write-Host "SELECT ch.c, new_rel.id FROM new_rel, (VALUES ('alpha'),('beta'),('stable')) AS ch(c)"
              Write-Host "ON CONFLICT (channel) DO UPDATE SET release_id = EXCLUDED.release_id, updated_at = now();"
            } else {
              Write-Host "INSERT INTO public.desktop_channels (channel, release_id)"
              Write-Host "SELECT 'alpha', id FROM new_rel"
              Write-Host "ON CONFLICT (channel) DO UPDATE SET release_id = EXCLUDED.release_id, updated_at = now();"
            }
            Write-Host ""
          }

          Write-Host ""
          Write-Host "Release token (masked in logs) — fetch the full UUID with:"
          Write-Host "  $tokenCmd"
          Write-Host ""
          Emit-Block "DEFAULT — register + point ALPHA only (ring model; promote to beta/stable later):" 'alpha'
          Emit-Block "FAST-TRACK — first release / hotfix: point ALL rings (skips the ring soak):" 'all'
          Write-Host "Run exactly ONE of the two blocks in the Supabase SQL editor."
          Write-Host "/desktop + the in-app updater read this row; without it the page stays on the old version."
          Write-Host "================================================================"
          Write-Host ""
