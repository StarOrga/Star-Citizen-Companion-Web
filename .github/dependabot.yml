# Dependabot configuration.
#
# Why this file exists: without it, Dependabot opens one PR per package. For
# the Angular framework packages that is fatal — bumping e.g. @angular/core
# alone leaves @angular/compiler-cli and the rest on the old version, `ng build`
# refuses the mismatch, and the Vercel preview deployment fails. Grouping every
# @angular/* package into a single PR keeps the framework version consistent so
# the preview build stays green. Non-Angular version updates are bundled too to
# cut PR noise; security updates outside Angular stay individual so they remain
# visible and can be merged fast.
#
# The `ignore:` blocks below exist for the opposite reason: a handful of
# dependencies are pinned by something outside Dependabot's view (a peer range,
# a transitive `~=` constraint, the embedded Python ABI). Without them
# Dependabot reopens the same unmergeable PR every week. Each block names what
# pins the dependency and what would let it be lifted — none of them is a
# blanket "never update".
version: 2
updates:
  # ---- Angular PWA (repo root) ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One PR for all Angular framework packages — version and security both,
      # so a security bump never lands a single mismatched @angular/* package.
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
      angular-security:
        applies-to: security-updates
        patterns:
          - "@angular/*"
      # Everything else, bundled to avoid a PR per dependency.
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"

  # ---- data-uploader (npm) ----
  - package-ecosystem: "npm"
    directory: "/data-uploader"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      uploader-npm:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # electron-vite is the build driver here and its peer range is
      # `^5 || ^6 || ^7` (still true for 5.0.0, the current latest). A vite major
      # therefore cannot be installed at all — #387 had to pin vite back to 7.3.6
      # to resolve exactly that peer conflict, and #388 reopened it a week later.
      # Minors and patches stay in scope. Lift this when electron-vite ships
      # vite 8 support.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  # ---- data-uploader (Python) ----
  - package-ecosystem: "pip"
    directory: "/data-uploader/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      uploader-python:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # TRANSITIVE scdatatools 1.0.4 deps — their versions are dictated by
      # scdatatools's own requires.txt (`~=` ranges), not free to pick. #200
      # blanket-bumped them to latest, which made `pip install -r
      # requirements.txt` unsolvable and broke every data-uploader-v* tag build
      # at fetch-embedded-python — invisibly, since the CI test jobs never
      # install requirements.txt. #389 proposed the identical set again.
      #
      # Only majors/minors are ignored: a patch inside scdatatools's `~=` range
      # is still installable, so security patches keep flowing. To lift any of
      # these for real, bump scdatatools itself.
      # See data-uploader/python/requirements.txt and
      # .claude/deep-knowledge/data-uploader-python.md.
      - dependency-name: "python-nubia"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pyquaternion"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pycryptodome"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "xxhash"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "zstandard"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # numpy is additionally capped by the runtime: embedded Python is 3.10.x
      # and 1.21.6 is the last 1.21.x with a cp310 wheel.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # sentry-sdk is pinned EXACTLY by scdatatools (`sentry-sdk==1.5.8`), so
      # even a patch bump is uninstallable.
      - dependency-name: "sentry-sdk"

  # ---- GitHub Actions workflows ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
