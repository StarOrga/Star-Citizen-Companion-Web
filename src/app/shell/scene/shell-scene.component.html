@if (on()) {
  <div class="scene" [attr.data-scene]="scene()" [attr.data-mode]="mode()" [attr.data-from]="from()"
       [attr.data-sub]="sub() ? '' : null" [attr.data-world]="world()" [attr.data-fade]="fadeTick() % 2"
       [style.--scene-move]="moveMs() ? moveMs() + 'ms' : null" [style.--pose-sky]="pose().sky"
       [style.--pose-sky-o]="pose().skyOpacity" [style.--pose-detail]="pose().detail" [style.--pose-ground]="pose().ground"
       [style.--pose-plane]="pose().plane" [style.--pose-dim]="pose().dim">
    <div class="sky" #sky><div class="neb"></div><div class="stars"></div><div class="stars near"></div></div>
    <!-- Verse subpage: the page's planet glows faintly where its emblem stands. -->
    <div class="halo"></div>
    <!-- Codex: the holo glow the camera turns towards. -->
    <div class="plane"><i></i></div>
    <!-- HQ: the night surface the camera dives towards (dark ground, faint city lights). -->
    <div class="detail"><i class="lights"></i></div>
    <div class="ground"></div>
    <div class="dim"></div>
  </div>
}
