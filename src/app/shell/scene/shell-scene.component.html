@if (on()) {
  <div class="scene" [attr.data-scene]="scene()" [attr.data-mode]="mode()" [attr.data-from]="from()"
       [attr.data-home]="home() ? '' : null" [attr.data-world]="world()" [attr.data-fade]="fadeTick() % 2"
       [style.--scene-move]="moveMs() ? moveMs() + 'ms' : null" [style.--pose-planet]="pose().planet" [style.--pose-sky]="pose().sky"
       [style.--pose-sky-o]="pose().skyOpacity" [style.--pose-detail]="pose().detail" [style.--pose-ground]="pose().ground"
       [style.--pose-plane]="pose().plane" [style.--pose-dim]="pose().dim">
    <div class="sky"><div class="neb"></div><div class="stars"></div><div class="stars near"></div></div>
    <!-- Verse subpage: the page's planet glows faintly where its emblem stands. -->
    <div class="halo"></div>
    <!-- Codex: the data plane the camera turns towards. -->
    <div class="plane"><i></i></div>
    <div class="follow">
      <div class="planet">
        <span class="pl-body"></span>
        <span class="pl-night"><i class="lt a"></i><i class="lt b"></i><i class="lt c"></i></span>
        <span class="pl-rim"></span>
      </div>
    </div>
    <!-- HQ: the planet surface the camera has dived onto (faint lights and grid). -->
    <div class="detail"><i class="grid"></i><i class="lights"></i></div>
    <div class="ground"></div>
    <div class="dim"></div>
  </div>
}
