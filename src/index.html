<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Star Citizen Companion</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="description" content="Star Citizen Companion (SCC) — Verse News, P4K analyzer, and more." />
    <meta name="author" content="StarOrga" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sc-companion.vercel.app/" />
    <!-- Open Graph / social — legitimacy signals for a real, maintained site -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Star Citizen Companion" />
    <meta property="og:title" content="Star Citizen Companion" />
    <meta property="og:description" content="Star Citizen Companion (SCC) — Verse News, P4K analyzer, and more." />
    <meta property="og:url" content="https://sc-companion.vercel.app/" />
    <meta property="og:image" content="https://sc-companion.vercel.app/icons/brand/scc-og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Star Citizen Companion" />
    <meta name="twitter:description" content="Star Citizen Companion (SCC) — Verse News, P4K analyzer, and more." />
    <meta name="twitter:image" content="https://sc-companion.vercel.app/icons/brand/scc-og-1200x630.png" />
    <meta name="application-name" content="Star Citizen Companion" />
    <!-- "dev" is intentional — postbuild (scripts/stamp-index-version.mjs) rewrites it to the
         release version; a hardcoded version here would silently drift from package.json. -->
    <meta name="app-version" content="dev" />
    <!-- Structured data — machine-readable identity for crawlers and URL-reputation
         scanners: who runs this site, what it is, and where the source lives. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Star Citizen Companion",
        "alternateName": "SCC",
        "url": "https://sc-companion.vercel.app/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "description": "Unofficial community companion app for Star Citizen: Verse news, codex, hangar and loadout tools. Not affiliated with Cloud Imperium Games.",
        "inLanguage": ["en", "de"],
        "publisher": {
          "@type": "Organization",
          "name": "StarOrga",
          "url": "https://github.com/StarOrga",
          "sameAs": ["https://github.com/StarOrga/Star-Citizen-Companion-Web"]
        }
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="icons/brand/scc-mark-compact.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="mask-icon" href="icons/brand/scc-mark-mono.svg" color="#52c1e6" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/brand/scc-apple-touch-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- RSI image CDNs — preconnect so news thumbnails start fetching sooner. -->
    <link rel="preconnect" href="https://media.robertsspaceindustries.com" crossorigin />
    <link rel="preconnect" href="https://robertsspaceindustries.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- First-paint boot splash. Rendered instantly from static HTML/CSS so a
         cold visit never shows a blank page while the Angular bundle downloads
         and boots. Lives inside <sc-root>, so Angular removes it automatically
         the moment the app renders — no teardown script needed. -->
    <style>
      html,
      body {
        margin: 0;
        background: #050810;
      }
      .sc-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #050810;
        color: #52c1e6;
        font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
      }
      .sc-boot__ring {
        position: relative;
        width: 96px;
        height: 96px;
      }
      .sc-boot__ring svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .sc-boot__arc {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #52c1e6;
        border-right-color: #52c1e6;
        animation: sc-boot-spin 0.9s linear infinite;
      }
      .sc-boot__word {
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #8aa0b3;
        font-weight: 600;
      }
      /* Critical CSS runs before styles.scss, so the --sc-fs-floor token does
         not exist yet — spell the 12px touch floor out literally here. */
      @media (pointer: coarse) {
        .sc-boot__word { font-size: 12px; }
      }
      .sc-boot__bar {
        width: 150px;
        height: 2px;
        border-radius: 2px;
        background: rgba(0, 212, 255, 0.15);
        overflow: hidden;
      }
      .sc-boot__bar > i {
        display: block;
        width: 40%;
        height: 100%;
        background: #52c1e6;
        animation: sc-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes sc-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes sc-boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(370%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sc-boot__arc {
          animation: none;
          border-color: rgba(0, 212, 255, 0.4);
          border-top-color: #52c1e6;
        }
        .sc-boot__bar > i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="sc-theme-dark">
    <sc-root>
      <div class="sc-boot" role="status" aria-label="Star Citizen Companion — loading">
        <div class="sc-boot__ring">
          <!-- BRAND-MARK:BEGIN -->
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64" role="img">
          <defs>
          <radialGradient id="scc-mark-disc" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#143049"/><stop offset="70%" stop-color="#0d2635"/><stop offset="100%" stop-color="#0d2635"/></radialGradient>
          <radialGradient id="scc-mark-core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a0dcf0" stop-opacity=".9"/><stop offset="45%" stop-color="#7dd5f0" stop-opacity=".42"/><stop offset="100%" stop-color="#52c1e6" stop-opacity="0"/></radialGradient>
          </defs>
          <circle cx="50" cy="50" r="49.5" fill="url(#scc-mark-disc)"/>
          <circle cx="50" cy="50" r="48.4" fill="none" stroke="#52c1e6" stroke-width="2.2" opacity=".55"/>
          <g transform="rotate(-20 50 50)">
          <ellipse cx="50" cy="50" rx="45" ry="12.5" fill="none" stroke="#52c1e6" stroke-width="2.2" opacity=".65"/>
          <ellipse cx="50" cy="50" rx="36" ry="10" fill="none" stroke="#52c1e6" stroke-width="1.7" opacity=".5"/>
          <ellipse cx="50" cy="50" rx="27" ry="7.5" fill="none" stroke="#52c1e6" stroke-width="1.3" opacity=".4"/>
          <circle cx="95" cy="50" r="2.6" fill="#7dd5f0"/><circle cx="14" cy="50" r="2.2" fill="#a0dcf0"/>
          </g>
          <circle cx="50" cy="50" r="22" fill="url(#scc-mark-core)"/>
          <g transform="translate(-25.00,-23.50) scale(0.5)">
          <path d="M150,125 C137,120 123,125 120,136 C117,147 119,160 126,166 C133,172 143,172 150,170" fill="#a0dcf0" fill-opacity=".40"/>
          <path d="M150,125 C163,120 177,125 180,136 C183,147 181,160 174,166 C167,172 157,172 150,170" fill="#a0dcf0" fill-opacity=".40"/>
          <path d="M150,126 C139,127 127,136 124,147 C121,156 122,164 128,170 C134,174 143,172 150,170" fill="none" stroke="#7dd5f0" stroke-width="6.5" stroke-linecap="round"/>
          <path d="M150,126 C161,127 173,136 176,147 C179,156 178,164 172,170 C166,174 157,172 150,170" fill="none" stroke="#7dd5f0" stroke-width="6.5" stroke-linecap="round"/>
          <line x1="150" y1="124" x2="150" y2="171" stroke="#a0dcf0" stroke-width="4"/>
          </g>
          </svg>
        <!-- BRAND-MARK:END -->
          <span class="sc-boot__arc" aria-hidden="true"></span>
        </div>
        <div class="sc-boot__word">Star Citizen Companion</div>
        <div class="sc-boot__bar" aria-hidden="true"><i></i></div>
      </div>
    </sc-root>
  </body>
</html>
