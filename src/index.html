<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Star Citizen Companion</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="description" content="Star Citizen Companion (SCC) — Verse News, P4K analyzer, and more." />
    <meta name="author" content="StarOrga" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sc-companion.vercel.app/" />
    <!-- Open Graph / social — legitimacy signals for a real, maintained site -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Star Citizen Companion" />
    <meta property="og:title" content="Star Citizen Companion" />
    <meta property="og:description" content="Star Citizen Companion (SCC) — Verse News, P4K analyzer, and more." />
    <meta property="og:url" content="https://sc-companion.vercel.app/" />
    <meta property="og:image" content="https://sc-companion.vercel.app/icons/brand/scc-og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Star Citizen Companion" />
    <meta name="twitter:description" content="Star Citizen Companion (SCC) — Verse News, P4K analyzer, and more." />
    <meta name="twitter:image" content="https://sc-companion.vercel.app/icons/brand/scc-og-1200x630.png" />
    <meta name="application-name" content="Star Citizen Companion" />
    <!-- "dev" is intentional — postbuild (scripts/stamp-index-version.mjs) rewrites it to the
         release version; a hardcoded version here would silently drift from package.json. -->
    <meta name="app-version" content="dev" />
    <!-- Structured data — machine-readable identity for crawlers and URL-reputation
         scanners: who runs this site, what it is, and where the source lives. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Star Citizen Companion",
        "alternateName": "SCC",
        "url": "https://sc-companion.vercel.app/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "description": "Unofficial community companion app for Star Citizen: Verse news, codex, hangar and loadout tools. Not affiliated with Cloud Imperium Games.",
        "inLanguage": ["en", "de"],
        "publisher": {
          "@type": "Organization",
          "name": "StarOrga",
          "url": "https://github.com/StarOrga",
          "sameAs": ["https://github.com/StarOrga/Star-Citizen-Companion-Web"]
        }
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="icons/brand/scc-mark.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="mask-icon" href="icons/brand/scc-mark-mono.svg" color="#52c1e6" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/brand/scc-apple-touch-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- RSI image CDNs — preconnect so news thumbnails start fetching sooner. -->
    <link rel="preconnect" href="https://media.robertsspaceindustries.com" crossorigin />
    <link rel="preconnect" href="https://robertsspaceindustries.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- First-paint boot splash. Rendered instantly from static HTML/CSS so a
         cold visit never shows a blank page while the Angular bundle downloads
         and boots. Lives inside <sc-root>, so Angular removes it automatically
         the moment the app renders — no teardown script needed. -->
    <style>
      html,
      body {
        margin: 0;
        background: #050810;
      }
      .sc-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #050810;
        color: #52c1e6;
        font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
      }
      .sc-boot__ring {
        position: relative;
        width: 96px;
        height: 96px;
      }
      .sc-boot__ring svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .sc-boot__arc {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #52c1e6;
        border-right-color: #52c1e6;
        animation: sc-boot-spin 0.9s linear infinite;
      }
      .sc-boot__word {
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #8aa0b3;
        font-weight: 600;
      }
      /* Critical CSS runs before styles.scss, so the --sc-fs-floor token does
         not exist yet — spell the 12px touch floor out literally here. */
      @media (pointer: coarse) {
        .sc-boot__word { font-size: 12px; }
      }
      .sc-boot__bar {
        width: 150px;
        height: 2px;
        border-radius: 2px;
        background: rgba(0, 212, 255, 0.15);
        overflow: hidden;
      }
      .sc-boot__bar > i {
        display: block;
        width: 40%;
        height: 100%;
        background: #52c1e6;
        animation: sc-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes sc-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes sc-boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(370%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sc-boot__arc {
          animation: none;
          border-color: rgba(0, 212, 255, 0.4);
          border-top-color: #52c1e6;
        }
        .sc-boot__bar > i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="sc-theme-dark">
    <sc-root>
      <div class="sc-boot" role="status" aria-label="Star Citizen Companion — loading">
        <div class="sc-boot__ring">
          <!-- BRAND-MARK:BEGIN -->
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="440" height="440">
          <defs>
          <!-- Tunnel depth -->
          <radialGradient id="scc-mark-tunnel" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d2635" stop-opacity="0"/><stop offset="50%" stop-color="#52c1e6" stop-opacity=".02"/><stop offset="75%" stop-color="#52c1e6" stop-opacity=".08"/><stop offset="90%" stop-color="#7dd5f0" stop-opacity=".10"/><stop offset="100%" stop-color="#52c1e6" stop-opacity=".02"/></radialGradient>
          <!-- Core glow: warm center, NOT white -->
          <radialGradient id="scc-mark-coreG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a0dcf0"/><stop offset="15%" stop-color="#7dd5f0"/><stop offset="50%" stop-color="#52c1e6" stop-opacity=".55"/><stop offset="85%" stop-color="#52c1e6" stop-opacity=".15"/><stop offset="100%" stop-color="#0d2635" stop-opacity="0"/></radialGradient>
          <!-- Brain fill -->
          <radialGradient id="scc-mark-brainG" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#d0eef8" stop-opacity=".2"/><stop offset="100%" stop-color="#52c1e6" stop-opacity=".04"/></radialGradient>
          <!-- Halo -->
          <radialGradient id="scc-mark-halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#52c1e6" stop-opacity=".28"/><stop offset="40%" stop-color="#52c1e6" stop-opacity=".08"/><stop offset="100%" stop-color="#52c1e6" stop-opacity="0"/></radialGradient>
          <!-- Filters -->
          <filter id="scc-mark-fCl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
          <!-- Outer nebula: gradient-based (no filter = no pixelation) -->
          <filter id="scc-mark-fW" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
          <filter id="scc-mark-fTw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5"/></filter>
          <filter id="scc-mark-fDk" x="-80%" y="-400%" width="260%" height="900%"><feGaussianBlur stdDeviation="3"/></filter>
          <filter id="scc-mark-fCo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="scc-mark-fNd" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="scc-mark-fBr" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <radialGradient id="scc-mark-bgFade" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d2635"/><stop offset="84%" stop-color="#0d2635"/><stop offset="95%" stop-color="#0d2635" stop-opacity=".45"/><stop offset="100%" stop-color="#0d2635" stop-opacity="0"/></radialGradient>
          </defs>

          <!-- Circular dark background — near-full-bleed disc, faded edge for subtlety -->
          <circle cx="150" cy="150" r="147" fill="url(#scc-mark-bgFade)"/>

          <!-- ===== 5% MARGIN: scale core content to 90% so the mark fills the icon canvas ===== -->
          <g transform="translate(15,15) scale(0.90)">

          <!-- ===== CLOUD LAYER 1 — Broad rotation (fills corners via larger rx/ry) ===== -->
          <g filter="url(#scc-mark-fCl)">
          <ellipse cx="150" cy="150" rx="155" ry="120" fill="none" stroke="#52c1e6" stroke-width="32" stroke-opacity=".11"/>
          <ellipse cx="150" cy="150" rx="145" ry="112" fill="none" stroke="#7dd5f0" stroke-width="16" stroke-opacity=".08"/>
          <!-- Corner cloud puffs (pushed outward to fill corners) -->
          <circle cx="150" cy="2" r="28" fill="#52c1e6" fill-opacity=".12"/>
          <circle cx="298" cy="150" r="26" fill="#52c1e6" fill-opacity=".11"/>
          <circle cx="150" cy="298" r="28" fill="#7dd5f0" fill-opacity=".10"/>
          <circle cx="2" cy="150" r="26" fill="#52c1e6" fill-opacity=".12"/>
          <!-- Diagonal puffs closer to actual corners -->
          <circle cx="270" cy="30" r="22" fill="#7dd5f0" fill-opacity=".09"/>
          <circle cx="270" cy="270" r="22" fill="#52c1e6" fill-opacity=".09"/>
          <circle cx="30" cy="270" r="24" fill="#7dd5f0" fill-opacity=".10"/>
          <circle cx="30" cy="30" r="22" fill="#52c1e6" fill-opacity=".09"/>
          </g>

          <!-- ===== CLOUD LAYER 2 — Counter-rotating wisps ===== -->
          <g filter="url(#scc-mark-fW)">
          <path d="M150,14 Q196,24 226,62 Q246,86 242,112" fill="none" stroke="#7dd5f0" stroke-width="6" stroke-linecap="round" stroke-opacity=".28"/>
          <path d="M284,190 Q276,224 250,248 Q228,268 198,278" fill="none" stroke="#7dd5f0" stroke-width="5" stroke-linecap="round" stroke-opacity=".25"/>
          <path d="M102,284 Q74,276 52,254 Q30,234 22,198" fill="none" stroke="#52c1e6" stroke-width="5" stroke-linecap="round" stroke-opacity=".24"/>
          <path d="M22,102 Q30,72 52,52 Q74,30 108,20" fill="none" stroke="#7dd5f0" stroke-width="4" stroke-linecap="round" stroke-opacity=".26"/>
          <!-- Gold wisps -->
          <path d="M206,280 Q228,260 244,234" fill="none" stroke="#c8a84b" stroke-width="3" stroke-linecap="round" stroke-opacity=".15"/>
          <path d="M58,46 Q42,66 34,92" fill="none" stroke="#c8a84b" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".12"/>
          <ellipse cx="244" cy="62" rx="28" ry="16" fill="#52c1e6" fill-opacity=".06" transform="rotate(40,244,62)"/>
          <ellipse cx="58" cy="244" rx="24" ry="14" fill="#7dd5f0" fill-opacity=".07" transform="rotate(-30,58,244)"/>
          </g>

          <!-- ===== CLOUD LAYER 3 — Fast thin wisps ===== -->
          <g filter="url(#scc-mark-fTw)">
          <path d="M150,6 Q168,18 178,40 Q184,58 174,76" fill="none" stroke="#7dd5f0" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".35"/>
          <path d="M280,112 Q286,132 284,150 Q282,170 272,186" fill="none" stroke="#52c1e6" stroke-width="2" stroke-linecap="round" stroke-opacity=".32"/>
          <path d="M268,56 Q232,82 208,112 Q190,132 178,150" fill="none" stroke="#52c1e6" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".22"/>
          <path d="M32,250 Q66,224 94,196 Q116,172 130,150" fill="none" stroke="#7dd5f0" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".20"/>
          </g>

          <!-- Tunnel depth -->
          <circle cx="150" cy="150" r="148" fill="url(#scc-mark-tunnel)"/>

          <!-- Drifting wisps -->
          <g filter="url(#scc-mark-fW)"><path d="M150,42 Q174,54 186,76 Q194,96 186,116" fill="none" stroke="#7dd5f0" stroke-width="4" stroke-linecap="round"/><path d="M94,34 Q74,52 64,78" fill="none" stroke="#52c1e6" stroke-width="3" stroke-linecap="round"/></g>
          <g filter="url(#scc-mark-fW)"><path d="M234,190 Q254,174 260,150 Q264,132 256,112" fill="none" stroke="#52c1e6" stroke-width="4" stroke-linecap="round"/></g>

          <!-- Cloud particles -->
          <circle cx="224" cy="56" r="1.5" fill="#7dd5f0" opacity=".4"/>
          <circle cx="48" cy="206" r="1" fill="#52c1e6" opacity=".35"/>

          <!-- ===== ACCRETION DISK (+10% scale: rx/ry increased) ===== -->
          <g>
          <!-- Track lines -->
          <ellipse cx="150" cy="150" rx="105" ry="28" fill="none" stroke="#52c1e6" stroke-width=".6" opacity=".18" transform="rotate(-20,150,150)"/>
          <ellipse cx="150" cy="150" rx="86" ry="22" fill="none" stroke="#52c1e6" stroke-width=".5" opacity=".16" transform="rotate(-20,150,150)"/>
          <ellipse cx="150" cy="150" rx="68" ry="17" fill="none" stroke="#52c1e6" stroke-width=".5" opacity=".14" transform="rotate(-20,150,150)"/>
          <!-- Traveling particles -->
          <ellipse cx="150" cy="150" rx="105" ry="28" fill="none" stroke="#52c1e6" stroke-width="5" stroke-dasharray="8 577" opacity=".85" transform="rotate(-20,150,150)" filter="url(#scc-mark-fDk)"/>
          <ellipse cx="150" cy="150" rx="105" ry="28" fill="none" stroke="#7dd5f0" stroke-width="3.5" stroke-dasharray="5 580" stroke-dashoffset="-220" opacity=".65" transform="rotate(-20,150,150)" filter="url(#scc-mark-fDk)" style="animation-delay:-7s"/>
          <ellipse cx="150" cy="150" rx="86" ry="22" fill="none" stroke="#52c1e6" stroke-width="4.5" stroke-dasharray="7 464" opacity=".82" transform="rotate(-20,150,150)" filter="url(#scc-mark-fDk)"/>
          <ellipse cx="150" cy="150" rx="86" ry="22" fill="none" stroke="#7dd5f0" stroke-width="3" stroke-dasharray="4 467" stroke-dashoffset="-155" opacity=".60" transform="rotate(-20,150,150)" filter="url(#scc-mark-fDk)" style="animation-delay:-4s"/>
          <ellipse cx="150" cy="150" rx="68" ry="17" fill="none" stroke="#52c1e6" stroke-width="4" stroke-dasharray="6 366" opacity=".80" transform="rotate(-20,150,150)" filter="url(#scc-mark-fDk)"/>
          </g>

          <!-- ===== BRAIN-NEBULA CORE (+10% size, seamless neural loops) ===== -->
          <g filter="url(#scc-mark-fBr)">
          <!-- Halo -->
          <circle cx="150" cy="150" r="46" fill="url(#scc-mark-halo)" style="transform-origin:150px 150px;animation-delay:-.4s"/>
          <!-- Core glow -->
          <circle cx="150" cy="150" r="35" fill="url(#scc-mark-coreG)" filter="url(#scc-mark-fCo)" style="transform-origin:150px 150px"/>

          <!-- Brain lobes (no outline, +10% size) -->
          <path d="M150,125 C137,120 123,125 120,136 C117,147 119,160 126,166 C133,172 143,172 150,170" fill="url(#scc-mark-brainG)" fill-opacity=".6" stroke="none"/>
          <path d="M150,125 C163,120 177,125 180,136 C183,147 181,160 174,166 C167,172 157,172 150,170" fill="url(#scc-mark-brainG)" fill-opacity=".6" stroke="none"/>
          <!-- Center fissure -->
          <line x1="150" y1="126" x2="150" y2="169" stroke="#52c1e6" stroke-width=".5" opacity=".3"/>
          <!-- Bottom fold -->
          <path d="M132,166 C136,174 164,174 168,166" fill="none" stroke="#52c1e6" stroke-width=".6" opacity=".35"/>
          <!-- Sulci -->
          <path d="M131,136 C128,142 128,150 130,157" fill="none" stroke="#7dd5f0" stroke-width=".7" opacity=".45"/>
          <path d="M136,148 C134,153 134,159 136,162" fill="none" stroke="#7dd5f0" stroke-width=".6" opacity=".4"/>
          <path d="M169,136 C172,142 172,150 170,157" fill="none" stroke="#7dd5f0" stroke-width=".7" opacity=".45"/>
          <path d="M164,148 C166,153 166,159 164,162" fill="none" stroke="#7dd5f0" stroke-width=".6" opacity=".4"/>

          <!-- Neural pulses (FIXED: dasharray=12 48, dashoffset=-60 = seamless tiling) -->
          <path d="M150,126 C139,127 127,136 124,147 C121,156 122,164 128,170 C134,174 143,172 150,170"
          fill="none" stroke="#7dd5f0" stroke-width="2" stroke-opacity=".8" stroke-dasharray="12 48" filter="url(#scc-mark-fNd)" stroke-linecap="round"/>
          <path d="M150,126 C161,127 173,136 176,147 C179,156 178,164 172,170 C166,174 157,172 150,170"
          fill="none" stroke="#7dd5f0" stroke-width="2" stroke-opacity=".8" stroke-dasharray="12 48" filter="url(#scc-mark-fNd)" stroke-linecap="round"/>
          <path d="M131,136 C128,142 128,150 130,157"
          fill="none" stroke="#e8ebed" stroke-width="1.5" stroke-opacity=".7" stroke-dasharray="6 24" filter="url(#scc-mark-fNd)" stroke-linecap="round"/>
          <path d="M169,136 C172,142 172,150 170,157"
          fill="none" stroke="#e8ebed" stroke-width="1.5" stroke-opacity=".7" stroke-dasharray="6 24" filter="url(#scc-mark-fNd)" stroke-linecap="round"/>
          <path d="M133,145 C140,143 148,143 150,144 C152,145 160,146 167,144"
          fill="none" stroke="#7dd5f0" stroke-width="1.2" stroke-opacity=".6" stroke-dasharray="8 32" filter="url(#scc-mark-fNd)" stroke-linecap="round"/>
          <path d="M130,161 C137,168 146,172 150,172 C154,172 163,168 170,161"
          fill="none" stroke="#7dd5f0" stroke-width="1.2" stroke-opacity=".6" stroke-dasharray="10 40" filter="url(#scc-mark-fNd)" stroke-linecap="round"/>

          <!-- Soft center (no hard white dot) -->
          <circle cx="150" cy="150" r="3.5" fill="#a0dcf0" opacity=".6"/>
          </g>

          </g><!-- end 5% margin scale group -->
          </svg>
        <!-- BRAND-MARK:END -->
          <span class="sc-boot__arc" aria-hidden="true"></span>
        </div>
        <div class="sc-boot__word">Star Citizen Companion</div>
        <div class="sc-boot__bar" aria-hidden="true"><i></i></div>
      </div>
    </sc-root>
  </body>
</html>
