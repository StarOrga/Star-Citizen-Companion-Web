      .scb-warp i:nth-child(3n + 1) { --w: 84px; --t: 1.4s; }
      .scb-warp i:nth-child(4n) { height: 1px; background: linear-gradient(90deg, transparent, rgba(82, 193, 230, 0.75)); }

        100% { transform: rotate(var(--r)) translateX(var(--far)) scaleX(1); opacity: 0; }

      .scb-vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 55%, rgba(2, 4, 8, 0.85) 100%); }
      /* soft orbit glow behind the logo */
      .scb-sorb { position: absolute; left: 50%; top: 46%; width: calc(var(--scb-logo) * 2.1); height: calc(var(--scb-logo) * 2.1); transform: translate(-50%, -50%); pointer-events: none; filter: blur(2px); opacity: 0.92; background: radial-gradient(circle at 50% 50%, rgba(98, 206, 240, 0.2), transparent 58%), radial-gradient(circle at 20% 30%, rgba(82, 193, 230, 0.16), transparent 24%), radial-gradient(circle at 78% 68%, rgba(98, 206, 240, 0.16), transparent 22%); }
      /* the app logo: round mask with a soft rim, cyan drop-shadow */

      @keyframes scb-shim { 0% { background-position: 130% 0; } 45%, 100% { background-position: -110% 0; } }

      @keyframes scb-phD{0%,48%{opacity:1}54%{opacity:.6}60%{opacity:0}78%{opacity:0}84%{opacity:.5}100%{opacity:1}}.scb-phd{animation:scb-phD 12s ease-in-out infinite}
      @keyframes scb-phT{0%,54%{opacity:0;letter-spacing:.35em}62%{opacity:1;letter-spacing:.2em}75%{opacity:1;letter-spacing:.2em}83%{opacity:0;letter-spacing:.5em}100%{opacity:0}}.scb-pht{animation:scb-phT 12s ease-in-out infinite}
      @keyframes scb-phCl{0%,38%{opacity:1;transform:scale(1)}44%{opacity:1;transform:scale(1.1)}50%,68%{opacity:1;transform:scale(.82)}80%{opacity:.6;transform:scale(1.05)}92%,100%{opacity:1;transform:scale(1)}}.scb-phcl{animation:scb-phCl 12s ease-in-out infinite;transform-origin:150px 150px}
